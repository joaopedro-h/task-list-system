<!DOCTYPE html>
<html lang="pt-BR">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="shortcut icon" href="../img/tarefas-icone.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/taskList.css">
    <link rel="stylesheet" href="../css/logout.css">
    <script src="../js/weather.js" defer></script>
    <script src="../js/keyboard.js" defer></script>
    <script src="../js/session.js" defer></script>
    <script src="../js/completeTask.js" defer></script>
    <script src="../js/editTask.js" defer></script>
    <script src="../js/inProgressTask.js" defer></script>
    <script src="../js/reopenTask.js" defer></script>
    <script src="../js/loadTasks.js" defer></script>
    <script src="../js/loadInProgressTasks.js" defer></script>
    <script src="../js/loadCompletedTasks.js" defer></script>
    <script src="../js/taskView.js" defer></script>
    <script src="../js/createTask.js" defer></script>
    <script src="../js/searchTask.js" defer></script>
    <script src="../js/logout.js" defer></script>

</head>

<body>

    <header class="header">

        <div class="header-title">
            <h1>Lista de tarefas</h1>
        </div>

        <div class="user-info">

            <span id="userName"></span>

            <button id="userMenuButton" type="button">▼</button>

            <div id="userMenu" class="user-menu">
                <button id="logoutButton" type="button">Sair</button>
            </div>

        </div>

    </header>

    <main class="task-container">

        <!-- Cabeçalho e criação de tarefas -->

        <section class="task-header">

            <div class="task-header-info">
                <h2>Tarefas do setor</h2>
                <p>Acompanhe e conclua as tarefas pendentes.</p>
            </div>

            <div class="weather-card">

                <div class="weather-location">
                    <span id="weatherCity"></span>
                    <span id="weatherRegion"></span>
                </div>

                <div class="weather-details">

                    <span id="weatherTemperature"></span>

                    <div class="weather-extra">
                        <p id="weatherCondition">Carregando clima...</p>
                        <p>
                            Chance de chuva:
                            <span id="weatherRainChance"></span>
                        </p>
                    </div>

                </div>

            </div>

            <button
                type="button"
                id="newTaskButton"
                class="new-task-button"
            >
                + Nova tarefa
            </button>

        </section>

        <!-- Pesquisa de tarefas -->

        <section class="task-actions">

            <h3 class="section-title">Pesquisa</h3>

            <div class="search-box">

                <input
                    type="text"
                    id="researchedTask"
                    placeholder="Pesquisar tarefa"
                >

                <button id="searchButton" type="button">
                    Pesquisar
                </button>

                <button
                    type="button"
                    id="clearSearchButton"
                    class="clear-search-button"
                >
                    Limpar busca
                </button>

            </div>

        </section>

        <!-- Navegação entre as visualizações -->

        <section class="task-navigation">

            <h3 class="section-title">Visualização das tarefas</h3>

            <div class="task-view-buttons">

                <button
                    type="button"
                    id="pendingTasksButton"
                    class="pending-tasks-button"
                >
                    Pendentes
                </button>

                <button
                    type="button"
                    id="inProgressTasksButton"
                    class="progress-tasks-button"
                >
                    Em andamento
                </button>

                <button
                    type="button"
                    id="completedTasksButton"
                    class="completed-tasks-button"
                >
                    Concluídas
                </button>

            </div>

        </section>

        <!-- Lista de tarefas -->

        <section class="task-list" id="taskList">

        </section>

        <!-- Overlay de criação -->

        <div id="taskOverlay" class="overlay">

            <div class="task-modal">

                <h2>Nova tarefa</h2>

                <form id="taskForm">

                    <div class="form-group">

                        <label for="task">Tarefa</label>

                        <input
                            type="text"
                            id="task"
                            placeholder="Digite a tarefa"
                            required
                        >

                    </div>

                    <div class="modal-buttons">

                        <p id="taskMessage" class="task-message"></p>

                        <button type="button" id="cancelTaskButton">
                            Sair
                        </button>

                        <button id="createTaskButton" type="submit">
                            Criar tarefa
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <!-- Overlay de pesquisa sem resultados -->

        <div id="searchOverlay" class="overlay">

            <div class="message error">

                <p id="searchMessage">Nenhuma tarefa encontrada.</p>

                <button id="searchMessageButton" type="button">
                    Fechar
                </button>

            </div>

        </div>

        <!-- Overlay de edição -->

        <div id="editTaskOverlay" class="overlay">

            <div class="task-modal">

                <h2>Editar tarefa</h2>

                <form id="editTaskForm">

                    <div class="form-group">

                        <label for="editTask">Tarefa</label>

                        <input
                            type="text"
                            id="editTask"
                            placeholder="Digite a tarefa"
                            required
                        >

                    </div>

                    <div class="modal-buttons">

                        <p id="taskMessageEdit" class="task-message"></p>

                        <button type="button" id="cancelEditTaskButton">
                            Sair
                        </button>

                        <button type="submit">
                            Salvar
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <!-- Overlay de sessão expirada -->

        <div id="sessionOverlay" class="overlay">

            <div class="message error">

                <p id="sessionMessage">
                    Sessão expirada, faça o login novamente.
                </p>

                <button id="sessionMessageButton" type="button">
                    Fechar
                </button>

            </div>

        </div>

    </main>

</body>
</html>
