<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="./img/login-icone.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js" defer></script>

</head>

<body>

<main class="login-menu">

        <section class="login-card">

            <div class="login-header">

                <h1>Login</h1>

                <p>
                    Insira suas credenciais para continuar.
                </p>

            </div>
            

            <form id="loginForm">

                
                <div class="form-group">

                    <label for="login">
                        Login
                    </label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Digite seu login"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                    >

                </div>


                <button type="submit">
                    Entrar
                </button>

            </form>

            <div class="register-link">

                <p>
                    Não possui uma conta?
                    <a href="register.html">Cadastre-se</a>
                </p>

            </div>

        </section>

        <div id="overlay" class="overlay">

            <div id="message" class="message">

                <span id="messageIcon"></span>
                <h2 id="messageTitle"></h2>
                <p id="messageText"></p>

                <button id="messageButton">OK</button>

            </div>

        </div>

    </main>

</body>
</html>
